# CI + deploy (spec §12 step 10). PRs (forks included) only build and test; pushes to main also deploy.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs; never cancel a deploy that is already running on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE: https://utah.otakar.dev
      # Push to main in this repo only: forks get no secrets and must never try to deploy.
      DEPLOY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.fork }}
    steps:
      - uses: actions/checkout@v7.0.1
      # No version input: the action reads packageManager from package.json.
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Written before the build, not just before db:local: `vite build` copies .dev.vars into dist/utah_snow/,
      # and `vite preview` (the e2e webServer) reads vars only from there. wrangler deploy never uploads it.
      - name: Write test .dev.vars
        run: printf 'DEV=1\nIP_HASH_SALT=test\nPROBE_KEY=test\n' > .dev.vars
      # Stamps __BUILD_ID__ = GITHUB_SHA[0:7] (vite.config.ts); the worker test project and e2e need dist/.
      - run: pnpm build
      - run: pnpm check
      - name: Migrate and seed local D1
        run: pnpm db:local
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm e2e
      # The CI reporter is 'github' (no HTML report); traces land in test-results/. Upload whichever exists.
      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      # `pnpm build` above wrote .wrangler/deploy/config.json -> dist/utah_snow/wrangler.json (assets dir
      # ../client), so a plain `deploy` ships the built worker and assets without rebuilding. Migrations pass
      # -c wrangler.jsonc so they read the source config (migrations_dir) instead of the redirect.
      - name: Apply D1 migrations and deploy
        if: env.DEPLOY == 'true'
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: |
            d1 migrations apply DB --remote -c wrangler.jsonc
            deploy
      - name: Wait for the new version to go live
        if: env.DEPLOY == 'true'
        shell: bash
        run: |
          want="${GITHUB_SHA::7}"
          deadline=$((SECONDS + 90))
          while :; do
            got=$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "$SITE/api/health" | jq -r '.version // empty' || true)
            if [ "$got" = "$want" ]; then
              echo "live version: $got"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error title=health::/api/health version is '${got:-none}' after 90 s, expected $want"
              exit 1
            fi
            sleep 5
          done
      - name: Probe upstream hosts
        if: env.DEPLOY == 'true'
        shell: bash
        env:
          PROBE_KEY: ${{ secrets.PROBE_KEY }}
        run: |
          if ! body=$(curl -fsS --max-time 60 -H "X-Probe-Key: $PROBE_KEY" "$SITE/api/debug/probe?src=all"); then
            echo "::warning title=probe::request failed (404 means the PROBE_KEY secret is missing or wrong)"
            exit 0
          fi
          jq -r '"probe: \(.count) hosts, \(.blocked) with blockedHint"' <<<"$body"
          jq -r '
            def esc: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            .rows[]
            | select(.blockedHint or .status >= 400 or .error != null)
            | [.hostId, "status=\(.status)", (if .blockedHint then "blockedHint" else empty end), .error, .url]
            | "::warning title=probe::" + (map(select(. != null)) | join(" ") | esc)
          ' <<<"$body"
